name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Taeglicher Neubau: haelt die statischen Fallback-Seiten /r/<slug>/ (Snapshot der Karten, siehe plugins/redirects.ts) aktuell.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE: /
          # Optional (Repo-Secrets): ohne beide nur die Demo-Weiterleitungen. Nie im Log ausgeben (oeffentliches Repo).
          FALLBACK_EXPORT_URL: ${{ secrets.FALLBACK_EXPORT_URL }}
          FALLBACK_EXPORT_TOKEN: ${{ secrets.FALLBACK_EXPORT_TOKEN }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
