<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b2c23">
<title>Bewertung schreiben – YANQIVA Demo</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="banner" role="region" aria-label="Demo-Hinweis">Demo: In Produktion leitet YANQIVA hier direkt auf die Google-Bewertungsseite weiter.</div>
<main>
  <a class="back" href="../">← Zurück zur Demo-Site</a>
  <div class="card" id="card">
    <div class="form">
      <h1>Bewertung schreiben</h1>
      <p class="biz" id="biz">Dein Unternehmen</p>
      <form id="form" novalidate>
        <fieldset>
          <legend>Deine Sternebewertung</legend>
          <div class="stars" id="stars" role="radiogroup" aria-label="Sterne" aria-describedby="msg"></div>
        </fieldset>
        <label class="t" for="text">Deine Erfahrung (optional)</label>
        <textarea id="text" maxlength="500" placeholder="Was hat dir gefallen?"></textarea>
        <p class="msg" id="msg" role="alert"></p>
        <button class="send" type="submit">Bewertung senden</button>
      </form>
    </div>
    <div class="done">
      <div class="ok" aria-hidden="true">✓</div>
      <h1 id="done-h" tabindex="-1">Danke! (Demo – es wurde nichts gesendet)</h1>
      <p>Diese Seite ist eine Simulation. Es wurden keine Daten übertragen.</p>
    </div>
  </div>
</main>
<script src="demo.js"></script>
</body>
</html>
